name: Debian package

# Builds the interim Skyscraper .deb via packaging/build-deb.sh on
# Debian trixie (matches the ShopnoOS ISO base; avoids libc mismatch).
#
# Release flow: tag a commit and push the tag, e.g.
#   git tag debian/3.21.1-1 && git push origin debian/3.21.1-1
# The build compiles the tagged commit explicitly (--pin-commit $GITHUB_SHA);
# the release job then creates a GitHub release with the .deb attached.
#
# For a new upstream version: bump PINNED_VERSION/PINNED_COMMIT in
# packaging/build-deb.sh first, then tag the new commit.

on:
  push:
    branches: [master]
    tags: ['debian/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ make dpkg-dev \
            qmake6 qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite p7zip-full
      - name: Build .deb
        run: ./packaging/build-deb.sh --out-dir dist --pin-commit "$GITHUB_SHA"
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyscraper-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/debian/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: skyscraper-deb
          path: dist
      - name: Create GitHub release with .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "Skyscraper Debian package ${tag#debian/}" \
            --notes "Interim Debian package for ShopnoOS gaming images. Install with \`sudo dpkg -i skyscraper_*.deb && sudo apt-get install -f\`. Built from the tagged commit via packaging/build-deb.sh on Debian trixie." \
            dist/*.deb
